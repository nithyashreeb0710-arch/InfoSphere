
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>InfoSphere | Explore Knowledge</title>

    <!-- Font Awesome Icons -->
    <script
        src="https://kit.fontawesome.com/1935d064dd.js"
        crossorigin="anonymous">
    </script>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <!-- Main Search Area -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">

                <!-- Colourful Globe -->
                <img
                    class="globe"
                    src="../images/globle.png"
                    alt="Colourful educational globe"
                />

                <!-- Website Heading -->
                <h1 class="site-title">InfoSphere</h1>
                <p class="tagline">Discover. Explore. Learn.</p>

                <!-- Search Bar -->
                <form class="search-form">
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search for knowledge..."
                        aria-label="Search for knowledge"
                    />

                    <button type="submit" class="search-button">
                        <i class="fas fa-search"></i>
                    </button>
                </form>

                <hr class="hide" />

            </div>
        </div>
    </div>

    <!-- Search Results -->
    <section>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="results py-3">
                        <p class="alert alert-danger hide"></p>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="../javascript/script.js"></script>

</body>
</html>
